<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Language Loop</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>Language Loop</h1>
        <p class="subtitle">Playback &amp; Dubbing Settings</p>
      </div>
      <label class="toggle" title="Enable or disable extension">
        <input type="checkbox" id="enabled" />
        <span class="toggle-slider"></span>
      </label>
    </header>

    <main id="settings-form">
      <!-- 1. Languages & Loop Size -->
      <section class="card">
        <h2>Languages &amp; Loop Size</h2>

        <div class="grid-2">
          <div class="field">
            <label for="targetLang">Target Language</label>
            <select id="targetLang"></select>
          </div>

          <div class="field">
            <label for="sourceLang">Source Language</label>
            <select id="sourceLang"></select>
          </div>
        </div>

        <div class="field inline-field">
          <label for="subtitlesPerLoop">Subtitles before loop</label>
          <input type="number" id="subtitlesPerLoop" min="1" max="50" step="1" />
        </div>
      </section>

      <!-- 2. Playback Sequence -->
      <section class="card">
        <div class="section-header">
          <h2>Playback Sequence</h2>
          <div class="inline-field compact">
            <label for="numPlaybacks">Playbacks:</label>
            <input type="number" id="numPlaybacks" min="1" max="10" step="1" />
          </div>
        </div>

        <div id="playback-list" class="playback-list"></div>
      </section>

      <details class="card tts-card">
        <summary>AI Translation &amp; Dubbing</summary>
        <div class="field">
          <label for="dubMode">Dubbing mode</label>
          <select id="dubMode">
            <option value="auto">Auto when no YouTube dub</option>
            <option value="force">Always use AI dub</option>
            <option value="off">Off</option>
          </select>
        </div>
        <div class="field">
          <label for="geminiApiKey">Gemini API Key</label>
          <input type="password" id="geminiApiKey" autocomplete="off" />
        </div>
        <div class="field">
          <label for="geminiModel">Gemini Model</label>
          <input type="text" id="geminiModel" placeholder="gemini-3.1-flash-lite" autocomplete="off" />
        </div>
        <div class="tts-actions">
          <button type="button" id="testGeminiBtn" class="btn-secondary">Test Gemini</button>
          <button type="button" id="clearTranslationCacheBtn" class="btn-secondary">Clear Translation Cache</button>
          <button type="button" id="clearVideoCacheBtn" class="btn-secondary">Clear Video Cache</button>
        </div>
        <div class="field">
          <label for="azureKey">Azure Speech Key</label>
          <input type="password" id="azureKey" autocomplete="off" />
        </div>
        <div class="field">
          <label for="azureRegion">Azure Region</label>
          <input type="text" id="azureRegion" placeholder="eastus" autocomplete="off" />
        </div>
        <div class="field">
          <label for="azureVoice">Fusha Voice</label>
          <select id="azureVoice">
            <option value="ar-SA-HamedNeural">Arabic (Saudi Arabia) - Hamed</option>
            <option value="ar-SA-ZariyahNeural">Arabic (Saudi Arabia) - Zariyah</option>
            <option value="ar-AE-HamdanNeural">Arabic (UAE) - Hamdan</option>
            <option value="ar-AE-FatimaNeural">Arabic (UAE) - Fatima</option>
            <option value="ar-JO-TaimNeural">Arabic (Jordan) - Taim</option>
            <option value="ar-JO-SanaNeural">Arabic (Jordan) - Sana</option>
            <option value="custom">Custom voice name…</option>
          </select>
          <input type="text" id="customAzureVoice" placeholder="Azure voice name" autocomplete="off" hidden />
        </div>
        <div class="field">
          <label for="overflowBehavior">When a dub exceeds its cue</label>
          <select id="overflowBehavior">
            <option value="speedup">Speed up to fit</option>
            <option value="pause">Pause video until dub finishes</option>
          </select>
        </div>
        <div class="tts-actions">
          <button type="button" id="testVoiceBtn" class="btn-secondary">Test Voice</button>
          <button type="button" id="clearTtsCacheBtn" class="btn-secondary">Clear Audio Cache</button>
        </div>
      </details>

      <details id="transcriptCard" class="card transcript-card">
        <summary>Transcript <span id="transcriptProgress" class="transcript-progress">0/0</span></summary>
        <div id="transcriptList" class="transcript-list">
          <p class="transcript-empty">Open a YouTube video to view the transcript.</p>
        </div>
      </details>
    </main>

    <div id="videoCacheStatus" class="video-cache-status" role="status" aria-live="polite">
      Video cache: Checking…
    </div>

    <footer class="footer">
      <button type="button" id="resetBtn" class="btn-secondary">Reset Defaults</button>
      <button type="button" id="reloadCaptionsBtn" class="btn-secondary">Reload Captions</button>
      <span id="status" class="status" aria-live="polite">Saved</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
